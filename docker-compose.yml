name: vyra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vyra
      POSTGRES_PASSWORD: vyra_dev_password
      POSTGRES_DB: vyra
    ports:
      - '5440:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vyra -d vyra']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vyra
      MINIO_ROOT_PASSWORD: vyra_dev_password
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
